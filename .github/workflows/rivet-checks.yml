name: Rivet checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rivet-checks-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  rivet-checks:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.23.2, 24.19.0]
    runs-on: ${{ vars.RIVET_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Install repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run repository checks
        run: npm run check
      - name: Run root manifest tests
        run: node --test scripts/refresh-release-manifest.test.mjs

  actionlint:
    runs-on: ${{ vars.RIVET_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        uses: reviewdog/action-actionlint@d290e336d5a743810aef4404f757dc862276d2ae # v1.73.4
        with:
          reporter: github-annotations
          filter_mode: nofilter
          fail_level: any
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Prepare compiled workflow lint copies
        run: |
          npm ci --prefix packages/rivet --ignore-scripts --no-audit --no-fund
          lint_dir="$RUNNER_TEMP/rivet-workflow-lint"
          rm -rf -- "$lint_dir"
          mkdir -p "$lint_dir"
          node packages/rivet/scripts/prepare-workflow-lint.mjs "$lint_dir"
      - name: Verify pinned workflow and review authority
        run: |
          npm --prefix packages/rivet run review-lock:check
          node packages/rivet/scripts/refresh-review-authority.mjs
      - name: Validate compiled adopter workflows
        uses: reviewdog/action-actionlint@d290e336d5a743810aef4404f757dc862276d2ae # v1.73.4
        with:
          reporter: github-annotations
          filter_mode: nofilter
          fail_level: any
          actionlint_flags: -shellcheck= -pyflakes= ${{ runner.temp }}/rivet-workflow-lint/*.yml
      - name: Clean compiled workflow lint copies
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/rivet-workflow-lint"
